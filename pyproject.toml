[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewsense-ptbr"
version = "0.1.0"
description = "Pipeline reprodutível de dados para avaliações em português brasileiro"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "threadpoolctl>=3.5,<4",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
# Instalar PyTorch CUDA separadamente; a instalação opcional não escolhe sua variante.
transformer = [
    "transformers>=5.22,<6",
    "accelerate>=1.15,<2",
    "huggingface-hub>=1.31,<3",
    "safetensors>=0.8,<1",
]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
reviewsense-data = "reviewsense.data:main"
reviewsense-baseline = "reviewsense.baseline:main"
reviewsense-transformer = "reviewsense.train_transformer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
